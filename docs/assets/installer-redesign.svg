<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" aria-labelledby="title desc" role="img" viewBox="0 0 1600 1110"><title id="title">Proposed VoiceStudio installation experience</title><desc id="desc">Three illustrative screens: review a target-bound installation plan, follow persistent download progress, and recover from a failure while retaining completed downloads. This is a design mockup, not a screenshot of implemented software. All storage numbers are illustrative.</desc><rect width="1600" height="1110" fill="#101b21"/><style>text{font-family:Inter,Arial,sans-serif}</style><text x="40" y="58" fill="#ecf6ef" font-size="34" font-weight="700">A first run that makes sense</text><text x="40" y="91" fill="#9eb6bb" font-size="18" font-weight="400">VoiceStudio installer redesign · proposed layouts · illustrative data, not an implemented screen</text><text x="40" y="143" fill="#eff8f5" font-size="24" font-weight="600">1 Review the plan</text><rect width="470" height="755" x="40" y="165" fill="#f5f8f4" rx="20"/><rect width="470" height="64" x="40" y="165" fill="#e6efea" rx="20"/><rect width="470" height="24" x="40" y="205" fill="#e6efea" rx="0"/><text x="62" y="204" fill="#183e3b" font-size="20" font-weight="700">VoiceStudio</text><text x="350" y="204" fill="#395b5c" font-size="14" font-weight="400">Help · English</text><text x="565" y="143" fill="#eff8f5" font-size="24" font-weight="600">2 See real progress</text><rect width="470" height="755" x="565" y="165" fill="#f5f8f4" rx="20"/><rect width="470" height="64" x="565" y="165" fill="#e6efea" rx="20"/><rect width="470" height="24" x="565" y="205" fill="#e6efea" rx="0"/><text x="587" y="204" fill="#183e3b" font-size="20" font-weight="700">VoiceStudio</text><text x="875" y="204" fill="#395b5c" font-size="14" font-weight="400">Help · English</text><text x="1090" y="143" fill="#eff8f5" font-size="24" font-weight="600">3 Recover in place</text><rect width="470" height="755" x="1090" y="165" fill="#f5f8f4" rx="20"/><rect width="470" height="64" x="1090" y="165" fill="#e6efea" rx="20"/><rect width="470" height="24" x="1090" y="205" fill="#e6efea" rx="0"/><text x="1112" y="204" fill="#183e3b" font-size="20" font-weight="700">VoiceStudio</text><text x="1400" y="204" fill="#395b5c" font-size="14" font-weight="400">Help · English</text><text x="64" y="266" fill="#152d35" font-size="27" font-weight="700">Your first voice</text><text x="64" y="295" fill="#152d35" font-size="18" font-weight="400">Goal: clone a voice</text><rect width="422" height="66" x="64" y="315" fill="#e7efea" rx="10"/><text x="80" y="341" fill="#345d58" font-size="13" font-weight="700">THIS COMPUTER · LINUX x64</text><text x="80" y="365" fill="#152d35" font-size="15" font-weight="400">CPU runtime · compatible voice-cloning model</text><text x="64" y="414" fill="#152d35" font-size="19" font-weight="700">Selected components</text><text x="64" y="449" fill="#152d35" font-size="18" font-weight="400">Local runtime</text><text x="370" y="449" fill="#08685b" font-size="15" font-weight="600">Verified</text><text x="64" y="483" fill="#152d35" font-size="18" font-weight="400">Voice-cloning model</text><text x="358" y="483" fill="#152d35" font-size="16" font-weight="400">3.0 GiB*</text><text x="64" y="516" fill="#152d35" font-size="18" font-weight="400">Speech recognition</text><text x="344" y="516" fill="#52646b" font-size="14" font-weight="400">Not selected</text><rect width="422" height="1" x="64" y="540" fill="#d8e1df" rx="0"/><text x="64" y="576" fill="#152d35" font-size="25" font-weight="700">3.0 GiB to download*</text><text x="64" y="607" fill="#52646b" font-size="16" font-weight="400">0.8 GiB verified and reusable*</text><text x="64" y="634" fill="#52646b" font-size="16" font-weight="400">4.2 GiB peak + 10 GiB reserve = 14.2 GiB*</text><text x="64" y="661" fill="#52646b" font-size="16" font-weight="400">18.0 GiB free on that drive*</text><rect width="422" height="68" x="64" y="684" fill="#fff" stroke="#d8e1df" rx="10"/><text x="78" y="711" fill="#152d35" font-size="15" font-weight="400">Models: /media/ssd/VoiceStudio</text><text x="78" y="736" fill="#08685b" font-size="14" font-weight="400">Change location · View files and licenses</text><text x="64" y="782" fill="#52646b" font-size="15" font-weight="400">Only these selected components will install</text><rect width="422" height="44" x="64" y="806" fill="#0c695f" rx="10"/><text x="80" y="834" fill="#fff" font-size="16" font-weight="600">Install selected components</text><text x="64" y="885" fill="#52646b" font-size="13" font-weight="400">*Illustrative totals. Actual plan resolves file bytes.</text><text x="589" y="266" fill="#152d35" font-size="27" font-weight="700">Installing your tools</text><text x="589" y="295" fill="#52646b" font-size="17" font-weight="400">This computer · Plan 1042</text><text x="589" y="337" fill="#152d35" font-size="24" font-weight="700">2.1 / 3.0 GiB downloaded*</text><rect width="422" height="10" x="589" y="357" fill="#d6e3dd" rx="5"/><rect width="295" height="10" x="589" y="357" fill="#0c695f" rx="5"/><text x="589" y="395" fill="#52646b" font-size="16" font-weight="400">70% · 12 MiB/s · about 80 seconds*</text><rect width="422" height="72" x="589" y="418" fill="#e7efea" rx="12"/><text x="605" y="452" fill="#0c695f" font-size="21" font-weight="700">1</text><text x="643" y="447" fill="#152d35" font-size="18" font-weight="600">Prepare runtime</text><text x="643" y="472" fill="#52646b" font-size="15" font-weight="400">Verified · kept after restart</text><rect width="422" height="72" x="589" y="505" fill="#e2efeb" rx="12"/><text x="605" y="539" fill="#0c695f" font-size="21" font-weight="700">2</text><text x="643" y="534" fill="#152d35" font-size="18" font-weight="600">Download model</text><text x="643" y="559" fill="#52646b" font-size="15" font-weight="400">2.1 GiB retained · verification pending*</text><rect width="422" height="72" x="589" y="592" fill="#edf0eb" rx="12"/><text x="605" y="626" fill="#0c695f" font-size="21" font-weight="700">3</text><text x="643" y="621" fill="#152d35" font-size="18" font-weight="600">Verify files</text><text x="643" y="646" fill="#52646b" font-size="15" font-weight="400">Checks every selected artifact</text><rect width="422" height="72" x="589" y="679" fill="#edf0eb" rx="12"/><text x="605" y="713" fill="#0c695f" font-size="21" font-weight="700">4</text><text x="643" y="708" fill="#152d35" font-size="18" font-weight="600">Try a voice</text><text x="643" y="733" fill="#52646b" font-size="15" font-weight="400">Generate a short local test</text><rect width="203" height="44" x="589" y="806" fill="#fff" stroke="#d5dfdf" rx="10"/><text x="605" y="834" fill="#24464b" font-size="16" font-weight="600">Cancel</text><rect width="203" height="44" x="808" y="806" fill="#fff" stroke="#d5dfdf" rx="10"/><text x="824" y="834" fill="#24464b" font-size="16" font-weight="600">View details</text><text x="589" y="885" fill="#52646b" font-size="14" font-weight="400">Completed work stays visible and counted</text><text x="1114" y="266" fill="#152d35" font-size="25" font-weight="700">Connection interrupted</text><text x="1114" y="295" fill="#52646b" font-size="17" font-weight="400">This computer · Plan 1042</text><rect width="422" height="114" x="1114" y="318" fill="#fff0d7" rx="12"/><text x="1130" y="351" fill="#694309" font-size="21" font-weight="600">Your downloads are saved</text><text x="1130" y="382" fill="#694309" font-size="16" font-weight="400">The model transfer stopped. Retry continues</text><text x="1130" y="407" fill="#694309" font-size="16" font-weight="400">from compatible partial data on this drive.</text><text x="1114" y="476" fill="#152d35" font-size="18" font-weight="600">Local runtime</text><text x="1422" y="476" fill="#08685b" font-size="15" font-weight="600">Verified</text><text x="1114" y="510" fill="#152d35" font-size="18" font-weight="600">Voice-cloning model</text><text x="1114" y="537" fill="#916213" font-size="16" font-weight="400">Interrupted · 2.1 GiB retained*</text><rect width="422" height="1" x="1114" y="563" fill="#d8e1df" rx="0"/><text x="1114" y="603" fill="#152d35" font-size="22" font-weight="700">No need to start again</text><text x="1114" y="636" fill="#52646b" font-size="16" font-weight="400">Keep the same model, target and location.</text><text x="1114" y="663" fill="#52646b" font-size="16" font-weight="400">Check network settings if retries fail.</text><text x="1114" y="690" fill="#52646b" font-size="16" font-weight="400">Your voices and projects are untouched.</text><text x="1114" y="751" fill="#08685b" font-size="15" font-weight="400">Network settings · View local diagnostics</text><rect width="251" height="44" x="1114" y="806" fill="#0c695f" rx="10"/><text x="1130" y="834" fill="#fff" font-size="16" font-weight="600">Retry interrupted transfer</text><rect width="155" height="44" x="1381" y="806" fill="#fff" stroke="#d5dfdf" rx="10"/><text x="1397" y="834" fill="#24464b" font-size="16" font-weight="600">Finish later</text><text x="1114" y="885" fill="#52646b" font-size="14" font-weight="400">Recovery never requires Advanced mode</text><text x="40" y="967" fill="#ecf6ef" font-size="25" font-weight="600">One contract. Existing executors. Honest evidence.</text><rect width="470" height="85" x="40" y="987" fill="#1b2e35" rx="13"/><text x="60" y="1018" fill="#a8d7c7" font-size="14" font-weight="700">NATIVE BOOTSTRAP</text><text x="60" y="1047" fill="#d7e8e7" font-size="16" font-weight="400">Runs before Python · owns runtime journal</text><rect width="470" height="85" x="565" y="987" fill="#1b2e35" rx="13"/><text x="585" y="1018" fill="#a8d7c7" font-size="14" font-weight="700">PYTHON COORDINATOR</text><text x="585" y="1047" fill="#d7e8e7" font-size="16" font-weight="400">Owns models / sidecars · selected target</text><rect width="470" height="85" x="1090" y="987" fill="#1b2e35" rx="13"/><text x="1110" y="1018" fill="#a8d7c7" font-size="14" font-weight="700">SHARED VIEW</text><text x="1110" y="1047" fill="#d7e8e7" font-size="16" font-weight="400">Approved plan · inventory · operation state</text></svg>